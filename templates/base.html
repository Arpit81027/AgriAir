<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgriAir{% endblock %}</title>
    <style>
        :root {
            --bg: #edf7f0;
            --bg-2: #f8fbf6;
            --panel: rgba(255,255,255,0.9);
            --primary: #1f8b47;
            --primary-dark: #0d5a2d;
            --secondary: #f2b75a;
            --text: #163323;
            --muted: #526658;
            --border: rgba(17, 53, 33, 0.09);
            --shadow: rgba(15, 42, 22, 0.12);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
            color: var(--text);
        }

        a { color: inherit; text-decoration: none; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(21, 82, 42, 0.92);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 1rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 22px rgba(10, 42, 20, 0.15);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            color: #fff;
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.045em;
            white-space: nowrap;
            transition: transform 0.2s ease;
        }

        .brand:hover {
            transform: translateY(-1px);
        }

        .brand-mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border: 1px solid rgba(255,255,255,0.24);
            border-radius: 14px;
            background: linear-gradient(145deg, #a8df75, #55b96b);
            box-shadow: 0 7px 18px rgba(5, 39, 16, 0.22);
        }

        .brand-mark svg {
            display: block;
            width: 27px;
            height: 27px;
        }

        .brand-word {
            background: linear-gradient(90deg, #fff 0%, #d7f6c1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand-word span {
            color: #b9e884;
        }

        .brand-caption {
            display: block;
            margin-top: 0.12rem;
            color: rgba(255,255,255,0.68);
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.13em;
            line-height: 1;
            text-transform: uppercase;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .nav a, .nav span {
            color: rgba(255,255,255,0.9);
            font-size: 0.95rem;
            padding: 0.55rem 0.8rem;
            border-radius: 999px;
            transition: 0.2s ease;
        }

        .nav span {
            font-weight: 700;
        }

        .nav a:hover {
            background: rgba(255,255,255,0.08);
        }

        .nav .profile-avatar {
            display: inline-grid;
            width: 42px;
            height: 42px;
            padding: 0.45rem;
            place-items: center;
            border: 1px solid rgba(255,255,255,0.55);
            background: rgba(255,255,255,0.14);
        }

        .nav .profile-avatar:hover,
        .nav .profile-avatar:focus-visible {
            background: rgba(255,255,255,0.26);
            outline: 2px solid rgba(255,255,255,0.75);
            outline-offset: 2px;
        }

        .profile-avatar svg {
            width: 26px;
            height: 26px;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.2rem 3rem;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: center;
            gap: 2rem;
            background: linear-gradient(135deg, #fffaf0 0%, #ecf9ee 100%);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 2.5rem;
            box-shadow: 0 18px 40px var(--shadow);
            overflow: hidden;
        }

        .badge {
            display: inline-block;
            background: rgba(31,139,71,0.1);
            color: var(--primary-dark);
            border: 1px solid rgba(31,139,71,0.2);
            padding: 0.45rem 0.8rem;
            font-weight: 700;
            border-radius: 999px;
            margin-bottom: 1rem;
        }

        .hero h1 {
            margin: 0 0 1rem;
            font-size: clamp(2.4rem, 5vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        .hero p {
            color: var(--muted);
            font-size: 1.08rem;
            line-height: 1.7;
            max-width: 620px;
        }

        .cta-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.7rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.95rem 1.5rem;
            border-radius: 14px;
            font-weight: 700;
            transition: 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 12px 25px rgba(16, 91, 45, 0.25);
        }

        .btn-secondary {
            background: white;
            color: var(--primary-dark);
            border-color: rgba(16, 91, 45, 0.15);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .hero-visual {
            position: relative;
            min-height: 420px;
        }

        .hero-photo {
            display: block;
            width: 100%;
            height: 420px;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(33, 62, 39, 0.16);
        }

        .floating-card {
            position: absolute;
            left: -12px;
            bottom: 20px;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(17, 53, 33, 0.08);
            border-radius: 18px;
            padding: 1rem 1.1rem;
            width: 220px;
            box-shadow: 0 18px 28px rgba(32, 50, 34, 0.12);
        }

        .floating-card strong {
            display: block;
            font-size: 1.5rem;
            color: var(--primary-dark);
        }

        .floating-card span {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .section {
            margin-top: 3rem;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .section-head h2 {
            margin: 0;
            font-size: clamp(1.6rem, 2vw, 2.4rem);
        }

        .section-head p {
            margin: 0;
            color: var(--muted);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.3rem;
        }

        .card {
            background: rgba(255,255,255,0.86);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.3rem;
            box-shadow: 0 12px 25px rgba(22, 51, 35, 0.06);
        }

        .icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(31,139,71,0.12), rgba(242,183,90,0.20));
            font-size: 1.4rem;
            margin-bottom: 0.8rem;
        }

        .card h3 {
            margin: 0 0 0.6rem;
            font-size: 1.15rem;
        }

        .card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .showcase {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .showcase-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(237,247,240,0.9));
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 1.3rem;
            box-shadow: 0 10px 25px rgba(20, 53, 27, 0.06);
        }

        .showcase-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 16px;
            display: block;
            margin-bottom: 1rem;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .metric {
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 10px 20px rgba(18, 48, 27, 0.05);
        }

        .metric .value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .metric .label {
            display: block;
            margin-top: 0.4rem;
            color: var(--muted);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        .table th, .table td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            background: rgba(31,139,71,0.06);
        }

        .status {
            display: inline-block;
            padding: 0.4rem 0.7rem;
            border-radius: 999px;
            background: #eaf9ef;
            color: var(--primary-dark);
            font-weight: 700;
        }

        form {
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.5rem;
            max-width: 520px;
            margin-top: 1.4rem;
            box-shadow: 0 12px 25px rgba(18, 48, 27, 0.06);
        }

        form input, form select, form textarea, form button {
            width: 100%;
            padding: 0.85rem 0.9rem;
            margin-bottom: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 1rem;
        }

        form button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            margin: 1rem 0;
            padding: 0.9rem 1rem;
            background: #edf9ee;
            border: 1px solid #d2ead9;
            border-radius: 10px;
            color: var(--primary-dark);
        }

        .auth-layout {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            max-width: 1000px;
            min-height: 600px;
            margin: 2rem auto;
            overflow: hidden;
            background: rgba(255,255,255,0.92);
            border: 1px solid var(--border);
            border-radius: 26px;
            box-shadow: 0 22px 55px var(--shadow);
        }

        .auth-visual {
            position: relative;
            display: flex;
            align-items: end;
            min-height: 600px;
            padding: 2rem;
            color: #fff;
            background:
                linear-gradient(180deg, rgba(8, 37, 20, 0.08) 10%, rgba(8, 37, 20, 0.82) 100%),
                url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=85') center/cover;
        }

        .auth-visual-content {
            position: relative;
            z-index: 1;
        }

        .auth-visual .badge {
            color: #fff;
            background: rgba(255,255,255,0.16);
            border-color: rgba(255,255,255,0.32);
        }

        .auth-visual h2 {
            margin: 0 0 0.8rem;
            font-size: clamp(2rem, 3vw, 2.8rem);
            line-height: 1.08;
        }

        .auth-visual p {
            max-width: 380px;
            margin: 0;
            color: rgba(255,255,255,0.86);
            line-height: 1.65;
        }

        .auth-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(1.5rem, 5vw, 3.5rem);
        }

        .auth-panel h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(1.9rem, 3vw, 2.4rem);
            letter-spacing: -0.03em;
        }

        .auth-subtitle {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        form.auth-form {
            width: 100%;
            max-width: none;
            margin: 1.5rem 0 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
        }

        .auth-form .field {
            margin-top: 1rem;
        }

        .auth-form label {
            display: block;
            margin-bottom: 0.45rem;
            color: var(--text);
            font-size: 0.92rem;
            font-weight: 700;
        }

        .auth-form input, .auth-form select {
            width: 100%;
            min-height: 48px;
            margin: 0;
            padding: 0.8rem 0.9rem;
            border: 1px solid rgba(17, 53, 33, 0.16);
            border-radius: 11px;
            background: #fbfdfb;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(31,139,71,0.13);
        }

        .auth-form button {
            min-height: 50px;
            margin: 1.4rem 0 0;
            border-radius: 12px;
        }

        .auth-form .helptext {
            display: block;
            margin-top: 0.45rem;
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .auth-form ul.errorlist {
            margin: 0.4rem 0 0;
            padding-left: 1.1rem;
            color: #a52b2b;
            font-size: 0.88rem;
        }

        .auth-form .non-field-errors {
            margin: 0 0 1rem;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            background: #fff0ee;
            color: #a52b2b;
            font-size: 0.9rem;
        }

        .auth-switch {
            margin: 1.2rem 0 0;
            color: var(--muted);
            text-align: center;
            font-size: 0.92rem;
        }

        .auth-switch a {
            color: var(--primary-dark);
            font-weight: 700;
        }

        .footer {
            text-align: center;
            color: var(--muted);
            padding: 2rem 1rem 3rem;
        }

        @media (max-width: 720px) {
            .topbar { padding: 1rem; flex-direction: column; }
            .hero { grid-template-columns: 1fr; padding: 1.2rem; }
            .showcase { grid-template-columns: 1fr; }
            .section-head { display: block; }
            .floating-card { position: static; width: 100%; margin-top: 1rem; }
            .auth-layout { grid-template-columns: 1fr; margin: 0.5rem auto; }
            .auth-visual { min-height: 220px; padding: 1.5rem; }
            .auth-panel { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'home' %}" aria-label="AgriAir home">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M25.8 5.5C16.3 5.6 9.1 8.5 7.5 15.1c-1.1 4.5 2.3 8.1 6.5 7.1 7.2-1.7 9.8-8.6 11.8-16.7Z" fill="#fff"/>
                    <path d="M6 27c3.8-6.7 8.4-10.8 15.1-14.3" stroke="#135B31" stroke-width="2.3" stroke-linecap="round"/>
                    <path d="M5 19c-1.7-4.3-.2-7.2 3.8-8.7 1 4.1-.2 7-3.8 8.7Z" fill="#E9FFD7"/>
                </svg>
            </span>
            <span>
                <span class="brand-word">Agri<span>Air</span></span>
                <span class="brand-caption">Smart farming</span>
            </span>
        </a>
        <nav class="nav">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'crops' %}">My Crops</a>
            <a href="{% url 'sensor-entry' %}">Sensor Data</a>
            <a href="{% url 'crop-health' %}">Crop Health</a>
            <a href="{% url 'recommendations' %}">Recommendations</a>
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}">Logout</a>
                <a class="profile-avatar" href="{% url 'profile' %}" aria-label="Edit farm profile" title="Edit farm profile">
                    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="16" cy="16" r="14" fill="#DDF3D2"/>
                        <circle cx="16" cy="12" r="5" fill="#176638"/>
                        <path d="M6.8 26c1.5-5 4.7-7.5 9.2-7.5s7.7 2.5 9.2 7.5" fill="#176638"/>
                    </svg>
                </a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        &copy; 2026 AgriAir | Smart farming insights for better yield decisions.
    </footer>
</body>
</html>
